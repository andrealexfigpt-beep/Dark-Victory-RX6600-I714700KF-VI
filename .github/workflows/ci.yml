name: CI

on:
  pull_request:
  push:
    branches: [main, native-only-v1]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build with diagnostics
        run: cargo build --workspace --features diagnostics --locked
      - name: Run all tests with diagnostics
        run: cargo test --workspace --features diagnostics --locked
      - name: Build victory diagnostic executable
        run: cargo build --locked --profile diag -p victory --features diagnostics
      - name: Upload victory diagnostic executable
        uses: actions/upload-artifact@v4
        with:
          name: victory-diag
          path: target/diag/victory.exe
          retention-days: 7
      - name: Upload required DLLs
        uses: actions/upload-artifact@v4
        with:
          name: victory-diag-runtime
          path: |
            target/diag/*.dll
            target/diag/*.pdb
          retention-days: 7