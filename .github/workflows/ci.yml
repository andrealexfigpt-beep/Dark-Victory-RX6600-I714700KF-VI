name: CI

on:
  pull_request:
  push:
    branches: [main, native-memory-v1]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

  native-memory:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build with native-memory and diagnostics
        run: cargo build --workspace --features "native-memory,diagnostics" --locked
      - name: Run native memory tests
        run: cargo test --workspace --features "native-memory,diagnostics" --locked native_mem
      - name: Run all tests with native backend
        run: cargo test --workspace --features "native-memory,diagnostics" --locked
      - name: Run native memory benchmarks
        run: cargo test --workspace --features "native-memory,diagnostics" --locked benchmarks -- --nocapture
      - name: Upload diagnostic executable
        uses: actions/upload-artifact@v4
        with:
          name: victory-gpu-native-memory-diagnostic
          path: target/debug/victory-gpu*.exe
          retention-days: 7
